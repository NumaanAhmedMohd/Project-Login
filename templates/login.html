<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TravelLand Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

height:100vh;

background:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600") no-repeat center center;

background-size:cover;

display:flex;

justify-content:center;

align-items:center;

font-family:Arial, Helvetica, sans-serif;

}

.login-card{

width:380px;

background:white;

padding:35px;

border-radius:15px;

box-shadow:0px 10px 25px rgba(0,0,0,.3);

}

.logo{

font-size:35px;

text-align:center;

}

.title{

text-align:center;

font-weight:bold;

margin-top:10px;

font-size:28px;

color:#0d6efd;

}

.subtitle{

text-align:center;

color:gray;

margin-bottom:25px;

}

.btn-primary{

width:100%;

}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🌍
</div>

<div class="title">
TravelLand
</div>

<div class="subtitle">
Login to Continue
</div>

<form action="/login" method="POST">

<div class="mb-3">

<label class="form-label">Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username"
required>

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<button class="btn btn-primary">

Login

</button>

</form>



<div id="errorMessage" class="alert alert-danger mt-3" style="display:none;">
    Invalid Username or Password
</div>


</div>



</div>

</body>

</html>
